  <h3 id="mt">New message</h3>
  <label>To<input id="mto" value="creatixstudiopersonal@gmail.com" readonly></label>

<script>
(function(){
 var m=document.querySelector('.menu'),l=document.getElementById('links');
 function t(o){l.classList.toggle('open',o);m.setAttribute('aria-expanded',o)}
 m.addEventListener('click',function(){t(!l.classList.contains('open'))});
 l.addEventListener('click',function(e){if(e.target.tagName==='A')t(false)});
 document.querySelectorAll('.track').forEach(function(k){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var c=k.firstElementChild.cloneNode(true);c.setAttribute('aria-hidden','true');k.appendChild(c)});
 var cb=document.getElementById('cp'),ad='creatixstudiopersonal@gmail.com';
 function fb(){var x=document.createElement('textarea');x.value=ad;document.body.appendChild(x);x.select();try{document.execCommand('copy');cb.textContent='Copied'}catch(e){}document.body.removeChild(x)}
 if(cb)cb.addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ad).then(function(){cb.textContent='Copied'},fb)}else fb()});
 var md=document.getElementById('md'),om=document.getElementById('om'),nm=document.getElementById('mnm'),mg=document.getElementById('mmg');
 function upd(){var n=nm.value.trim(),m=mg.value.trim(),su='Enquiry from Creatix Studio website',bd='Hi Creatix Studio,\n\n'+m+(n?'\n\n'+n:'');
  document.getElementById('mg').href='https://mail.google.com/mail/?view=cm&fs=1&to='+ad+'&su='+encodeURIComponent(su)+'&body='+encodeURIComponent(bd)}
 function shut(){md.hidden=true;om.focus()}
 if(om&&md){om.addEventListener('click',function(){md.hidden=false;upd();mg.focus()});
  nm.addEventListener('input',upd);mg.addEventListener('input',upd);
  document.getElementById('mx').addEventListener('click',shut);
  md.addEventListener('click',function(e){if(e.target===md)shut()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!md.hidden)shut()})}
 var rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 var els=document.querySelectorAll('.stats strong');
 if(rm||!('IntersectionObserver' in window))return;
 var io=new IntersectionObserver(function(es){es.forEach(function(e){
  if(!e.isIntersecting)return;io.unobserve(e.target);
  var el=e.target,n=+el.dataset.n,d=+el.dataset.d||0,s=el.dataset.s||'',st=performance.now();
  (function f(now){var p=Math.min((now-st)/1200,1),v=n*(1-Math.pow(1-p,3));
   el.textContent=v.toFixed(d)+s;if(p<1)requestAnimationFrame(f)})(st);
 })},{threshold:.6});
 els.forEach(function(e){io.observe(e)});
})();
</script>
